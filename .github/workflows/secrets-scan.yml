name: シークレット定期スキャン

on:
  schedule:
    # 毎週月曜 9:00 JST（日曜 24:00 UTC）
    - cron: "0 0 * * 1"
  workflow_dispatch: # 手動実行も可能

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect-secrets インストール
        # .secrets.baseline を作った版と同じにする（版が変わると検出する種類が変わる）
        run: python3 -m pip install detect-secrets==1.5.0

      - name: フルスキャン実行
        id: scan
        run: |
          # 除外条件と、.secrets.baseline に記録済みの候補を除く処理は CI と共通（.github/scripts/find_new_secrets.py）
          COUNT=$(python3 .github/scripts/find_new_secrets.py .secrets-scan-result.json)
          echo "secret_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "新しい候補の件数: $COUNT"

      - name: 検出結果をIssueで通知
        if: steps.scan.outputs.secret_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('.secrets-scan-result.json', 'utf8'));
            const files = Object.keys(result.results || {});
            const count = ${{ steps.scan.outputs.secret_count }};

            let body = `## detect-secrets 定期スキャン結果\n\n`;
            body += `**検出件数: ${count} 件**\n\n`;
            body += `| ファイル | 行番号 | 種別 |\n|---------|--------|------|\n`;

            for (const file of files) {
              for (const secret of result.results[file]) {
                body += `| \`${file}\` | ${secret.line_number} | ${secret.type} |\n`;
              }
            }

            body += `\n### 対処手順\n`;
            body += `1. 該当ファイルを確認し、シークレットが本物か誤検知かを判定\n`;
            body += `2. 本物の場合: シークレットをローテーションし、環境変数に移行\n`;
            body += `3. 誤検知の場合: ベースラインに追加してコミット (\`detect-secrets scan --baseline .secrets.baseline\`)\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[自動] detect-secrets: ${count}件のシークレット候補を検出`,
              body: body,
              labels: ['security']
            });
